<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Téglatörő – MiniGames</title><style>body{margin:0;background:#101827;color:#f3f7ff;font:17px system-ui;text-align:center;padding:14px}.wrap{max-width:560px;margin:auto}h1{color:#78ead8}canvas{display:block;width:min(94vw,480px);height:auto;margin:12px auto;border:3px solid #3b5875;border-radius:14px;background:#07111d;touch-action:none}button{min-height:44px;border:0;border-radius:10px;background:#70e2cf;color:#10202d;font-weight:800;padding:10px 18px}p{color:#c6d5e9}a{color:#78ead8}</style><div class="wrap"><h1>🧱 Téglatörő</h1><p>Pattintsd vissza a labdát, törd össze az összes téglát, és vigyázz, három életed van!</p><p id="stats">Pont: 0 · Élet: 3 · Pálya: 1</p><canvas id="board" width="480" height="520"></canvas><button id="start">Indítás / újrakezdés</button><p id="msg" aria-live="polite">Mozgasd az ujjad vagy az egeret a rakéta irányításához.</p><p><a href="../">← MiniGames főoldal</a></p></div><script>const c=document.getElementById("board"),g=c.getContext("2d");let paddle,ball,bricks,score,lives,level,run=false,raf=0;function build(){bricks=[];for(let r=0;r<4+level;r++)for(let col=0;col<7;col++)bricks.push({x:12+col*65,y:45+r*27,w:59,h:19,on:true,color:["#e87979","#e9ad59","#e9d66a","#5ed0a5","#66a9ed"][r%5]})}function reset(){cancelAnimationFrame(raf);score=0;lives=3;level=1;paddle={x:195,w:90};ball={x:240,y:430,vx:3,vy:-4,r:8};build();run=true;document.getElementById("msg").textContent="Hajrá!";loop()}function move(e){let rect=c.getBoundingClientRect(),px=(e.clientX-rect.left)*c.width/rect.width;paddle.x=Math.max(0,Math.min(480-paddle.w,px-paddle.w/2))}c.addEventListener("pointermove",move);c.addEventListener("pointerdown",move);function loop(){if(!run)return;g.fillStyle="#07111d";g.fillRect(0,0,480,520);bricks.forEach(b=>{if(b.on){g.fillStyle=b.color;g.fillRect(b.x,b.y,b.w,b.h)}});ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>480-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;if(ball.vy>0&&ball.y+ball.r>=470&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*5}let hit=bricks.find(b=>b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h);if(hit){hit.on=false;ball.vy*=-1;score+=10}if(ball.y>530){lives--;if(lives<=0){end(false);return}ball={x:240,y:430,vx:3,vy:-4}}if(bricks.every(b=>!b.on)){level++;if(level>5){end(true);return}build();ball={x:240,y:430,vx:3+level*.3,vy:-4-level*.3}}g.fillStyle="#70e2cf";g.fillRect(paddle.x,470,paddle.w,12);g.fillStyle="#fff";g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();document.getElementById("stats").textContent="Pont: "+score+" · Élet: "+lives+" · Pálya: "+level+"/5";raf=requestAnimationFrame(loop)}function end(win){run=false;cancelAnimationFrame(raf);document.getElementById("msg").textContent=win?"Minden pályát teljesítettél! Bajnok vagy! 🏆":"Elfogyott az életed. Pontszám: "+score+". Próbáld újra!"}document.getElementById("start").onclick=reset;g.fillStyle="#20344d";g.fillRect(0,0,480,520);g.fillStyle="#fff";g.font="20px system-ui";g.fillText("Nyomd meg az indítást!",130,250);</script></html>
