<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake – MiniGames</title><style>body{margin:0;background:#101827;color:#f3f7ff;font:17px system-ui;text-align:center;padding:14px}.wrap{max-width:560px;margin:auto}h1{color:#78ead8}canvas{display:block;width:min(94vw,480px);height:auto;margin:12px auto;border:3px solid #3b5875;border-radius:14px;background:#07111d;touch-action:none}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{min-width:48px;min-height:44px;border:0;border-radius:10px;background:#70e2cf;color:#10202d;font-weight:800;padding:10px 15px}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;margin:12px}.pad button{font-size:20px}p{color:#c6d5e9}a{color:#78ead8}</style><div class="wrap"><h1>🐍 Snake – Kígyó</h1><p>Gyűjtsd össze az almákat, és ne ütközz a falnak vagy a saját farkadnak!</p><p id="score">Pont: 0 · Rekord: 0</p><canvas id="game" width="480" height="480" aria-label="Snake játéktér"></canvas><div class="row"><button id="start">Indítás / újra</button><button id="pause">Szünet</button><select id="speed" aria-label="Sebesség"><option value="150">Lassú</option><option value="105" selected>Normál</option><option value="70">Gyors</option></select></div><div class="pad"><span></span><button data-dir="up">⬆</button><span></span><button data-dir="left">⬅</button><button data-dir="down">⬇</button><button data-dir="right">➡</button></div><p id="msg" aria-live="polite">Használd a nyilakat, vagy a képernyőgombokat!</p><p><a href="../">← MiniGames főoldal</a></p></div><script>const c=document.getElementById("game"),ctx=c.getContext("2d"),N=24,S=20;let snake,dir,next,food,score,timer=null,paused=false,over=true,record=+(localStorage.getItem("mgSnakeRecord")||0);function rand(){return {x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}function place(){do{food=rand()}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function draw(){ctx.fillStyle="#07111d";ctx.fillRect(0,0,480,480);ctx.strokeStyle="#14283b";for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke()}ctx.fillStyle="#ff626d";ctx.beginPath();ctx.arc(food.x*S+10,food.y*S+10,8,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?"#45c8a5":"#a2f5d9";ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)})}function update(){let h={x:snake[0].x+next.x,y:snake[0].y+next.y};let eat=h.x===food.x&&h.y===food.y;if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.slice(0,eat?snake.length:snake.length-1).some(p=>p.x===h.x&&p.y===h.y)){finish();return}snake.unshift(h);if(eat){score++;if(score>record){record=score;localStorage.setItem("mgSnakeRecord",record)}place()}else snake.pop();dir=next;document.getElementById("score").textContent="Pont: "+score+" · Rekord: "+record;draw()}function start(){clearInterval(timer);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir=next={x:1,y:0};score=0;paused=false;over=false;place();document.getElementById("msg").textContent="Jó játékot!";document.getElementById("score").textContent="Pont: 0 · Rekord: "+record;draw();timer=setInterval(()=>{if(!paused&&!over)update()},+document.getElementById("speed").value)}function finish(){over=true;clearInterval(timer);document.getElementById("msg").textContent="Vége a játéknak! Pontszám: "+score+". Indíts új játékot!"}function turn(d){if(over)return;let v={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(v.x!==-dir.x||v.y!==-dir.y)next=v}document.addEventListener("keydown",e=>{let m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();turn(m[e.key])}});document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>turn(b.dataset.dir));document.getElementById("start").onclick=start;document.getElementById("pause").onclick=()=>{if(over)return;paused=!paused;document.getElementById("msg").textContent=paused?"Szünet":"Folytatás!"};document.getElementById("speed").onchange=()=>{if(!over)start()};draw();</script></html>
