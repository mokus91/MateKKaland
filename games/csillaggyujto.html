<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Csillaggyűjtő – MiniGames</title><style>body{margin:0;background:#101a30;color:#fff;font:19px system-ui;text-align:center;padding:16px}.box{max-width:520px;margin:auto}h1{color:#7bead8}.field{height:330px;position:relative;border:2px solid #365477;border-radius:20px;background:radial-gradient(circle,#233c61,#132039);overflow:hidden;touch-action:manipulation}.star{position:absolute;border:0;background:transparent;font-size:42px;cursor:pointer;transform:translate(-50%,-50%);padding:8px}.controls button{padding:12px 20px;border:0;border-radius:12px;background:#76ead8;color:#102039;font-weight:bold;font-size:17px;cursor:pointer;margin:5px}p{color:#cbd7eb}a{color:#7bead8}</style><div class="box"><h1>⭐ Csillaggyűjtő</h1><p>Gyűjts minél több csillagot 60 másodperc alatt! Cél: 30 csillag.</p><p id="score">Csillag: 0 / 30 · Idő: 60 mp</p><div class="field" id="field"><button class="star" id="star" aria-label="Csillag">⭐</button></div><p id="msg" aria-live="polite">Nyomd meg az indítást!</p><div class="controls"><button onclick="start()">Játék indítása</button></div><p><a href="../">← Vissza a MiniGames oldalra</a></p></div><script>let score=0,time=60,active=false,timer=null;const star=document.getElementById("star"),field=document.getElementById("field");function move(){star.style.left=(8+Math.random()*84)+"%";star.style.top=(12+Math.random()*76)+"%"}function update(){document.getElementById("score").textContent="Csillag: "+score+" / 30 · Idő: "+time+" mp"}function start(){clearInterval(timer);score=0;time=60;active=true;star.hidden=false;document.getElementById("msg").textContent="Hajrá!";move();update();timer=setInterval(()=>{time--;update();if(time<=0||score>=30)finish()},1000)}function finish(){clearInterval(timer);active=false;star.hidden=true;document.getElementById("msg").textContent=score>=30?"Megvan a 30 csillag! Bajnok vagy! 🏆":"Lejárt az idő! "+score+" csillagot gyűjtöttél. Próbáld újra!"}star.onclick=()=>{if(!active)return;score++;update();if(score>=30)finish();else move()};</script></html>
