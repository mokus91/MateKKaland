<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Csillaggyűjtő – MiniGames</title><style>body{margin:0;background:#101a30;color:#fff;font:19px system-ui;text-align:center;padding:20px}.box{max-width:500px;margin:auto}h1{color:#7bead8}.field{height:300px;position:relative;border:2px solid #365477;border-radius:20px;background:radial-gradient(circle,#233c61,#132039);overflow:hidden}.star{position:absolute;border:0;background:transparent;font-size:44px;cursor:pointer;transform:translate(-50%,-50%)}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.controls button,.again{padding:12px 20px;border:0;border-radius:12px;background:#76ead8;color:#102039;font-weight:bold;font-size:18px;cursor:pointer}p{color:#cbd7eb}</style><div class="box"><h1>⭐ Csillaggyűjtő</h1><p>Nyomj a csillagra, mielőtt új helyre ugrik! Gyűjts 10 pontot.</p><p id="score">Pont: 0 / 10</p><div class="field" id="field"><button class="star" id="star" aria-label="Csillag">⭐</button></div><p id="msg" aria-live="polite">Kezdheted!</p><div class="controls"><button onclick="start()">Újrakezdés</button></div><p><a href="../" style="color:#7bead8">← Vissza a MiniGames oldalra</a></p></div><script>let score=0,active=true;const star=document.getElementById("star"),field=document.getElementById("field");function move(){star.style.left=(8+Math.random()*84)+"%";star.style.top=(12+Math.random()*76)+"%"}function start(){score=0;active=true;document.getElementById("score").textContent="Pont: 0 / 10";document.getElementById("msg").textContent="Hajrá!";star.hidden=false;move()}star.onclick=()=>{if(!active)return;score++;document.getElementById("score").textContent="Pont: "+score+" / 10";if(score>=10){active=false;star.hidden=true;document.getElementById("msg").textContent="Megcsináltad! Igazi csillagvadász vagy! 🎉"}else move()};move();</script></html>
