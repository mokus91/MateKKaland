<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Színkereső – MiniGames</title><style>body{margin:0;background:#101a30;color:white;font:19px system-ui;text-align:center;padding:16px}.box{max-width:540px;margin:auto}h1{color:#78ead8}.target{font-size:30px;font-weight:bold;margin:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{height:85px;border:4px solid #ffffff30;border-radius:15px;cursor:pointer}button.again{margin:16px;padding:12px 22px;border:0;border-radius:12px;background:#76ead8;font-weight:bold;font-size:17px}p{color:#cbd7eb}a{color:#78ead8}</style><div class="box"><h1>🎨 Színkereső</h1><p>Találd meg a megadott színt! 5 körös, 15 körös vagy végtelen gyakorlás.</p><button class="again" onclick="start(5)">5 kör</button><button class="again" onclick="start(15)">15 kör</button><button class="again" onclick="start(0)">Gyakorlás</button><div class="target" id="target">Nyomj egy módra!</div><p id="info">Pont: 0</p><div class="grid" id="grid"></div><p id="msg" aria-live="polite"></p><p><a href="../">← Vissza a MiniGames oldalra</a></p></div><script>const colors=[["piros","#ef4444"],["kék","#3b82f6"],["zöld","#22c55e"],["sárga","#facc15"],["lila","#a855f7"],["narancs","#f97316"],["rózsaszín","#ec4899"],["türkiz","#14b8a6"],["barna","#92400e"]];let score=0,roundNo=0,total=15,playing=false;function round(){if(total&&roundNo>=total){finish();return}roundNo++;let target=colors[Math.floor(Math.random()*colors.length)];document.getElementById("target").textContent="Keresd ezt a színt: "+target[0];let opts=[target,...colors.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);document.getElementById("grid").innerHTML=opts.map(x=>'<button class="tile" style="background:'+x[1]+'" aria-label="'+x[0]+'"></button>').join("");document.querySelectorAll(".tile").forEach((b,i)=>b.onclick=()=>{if(!playing)return;if(opts[i]===target){score++;document.getElementById("msg").textContent="Eltaláltad! 🌟";update();round()}else{document.getElementById("msg").textContent="Ez most nem az. Próbáld újra!";score=Math.max(0,score-1);update()}});update()}function update(){document.getElementById("info").textContent="Pont: "+score+" · Kör: "+roundNo+(total?" / "+total:"")}function finish(){playing=false;document.getElementById("target").textContent="🎉 Ügyes voltál!";document.getElementById("grid").innerHTML="";document.getElementById("msg").textContent="Eredmény: "+score+" pont / "+total+" kör."}function start(t){score=0;roundNo=0;total=t;playing=true;document.getElementById("msg").textContent="Kezdődjön a játék!";round()}start(15);</script></html>
