<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Színkereső – MiniGames</title><style>body{margin:0;background:#101a30;color:white;font:19px system-ui;text-align:center;padding:20px}.box{max-width:500px;margin:auto}h1{color:#78ead8}.target{font-size:32px;font-weight:bold;margin:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{height:100px;border:4px solid #ffffff30;border-radius:17px;cursor:pointer}.tile:focus{outline:4px solid white}button.again{margin:20px;padding:12px 24px;border:0;border-radius:12px;background:#76ead8;font-weight:bold;font-size:17px}p{color:#cbd7eb}</style><div class="box"><h1>🎨 Színkereső</h1><p>Kattints arra a négyzetre, amelyik szín nevét látod!</p><div class="target" id="target"></div><p id="info">Pont: 0 · Idő: 30</p><div class="grid" id="grid"></div><p id="msg" aria-live="polite"></p><button class="again" onclick="start()">Játék indítása</button><p><a href="../" style="color:#78ead8">← Vissza a MiniGames oldalra</a></p></div><script>const colors=[["piros","#ef4444"],["kék","#3b82f6"],["zöld","#22c55e"],["sárga","#facc15"],["lila","#a855f7"],["narancs","#f97316"]];let score=0,time=30,timer=null,playing=false;function round(){let target=colors[Math.floor(Math.random()*colors.length)];document.getElementById("target").textContent="Keresd: "+target[0];let opts=[target,...colors.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);document.getElementById("grid").innerHTML=opts.map(x=>'<button class="tile" style="background:'+x[1]+'" aria-label="'+x[0]+'"></button>').join("");document.querySelectorAll(".tile").forEach((b,i)=>b.onclick=()=>{if(!playing)return;if(opts[i]===target){score++;document.getElementById("msg").textContent="Szuper! 🌟";round()}else{score=Math.max(0,score-1);document.getElementById("msg").textContent="Próbáld újra!"}update()})}function update(){document.getElementById("info").textContent="Pont: "+score+" · Idő: "+time}function start(){clearInterval(timer);score=0;time=30;playing=true;document.getElementById("msg").textContent="Hajrá!";round();update();timer=setInterval(()=>{time--;update();if(time<=0){clearInterval(timer);playing=false;document.getElementById("target").textContent="Lejárt az idő!";document.getElementById("grid").innerHTML="";document.getElementById("msg").textContent="Ennyi pontot szereztél: "+score+" 🎉"}},1000)}start();</script></html>
