<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a30"><title>Buborékvár – MiniGames</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font:16px system-ui;text-align:center;padding:14px}main{max-width:760px;margin:auto}a{color:#5eead4}h1{margin:8px;font-size:clamp(25px,5vw,38px)}p{color:#b8c5dc}.panel{background:#17233b;border:1px solid #344563;border-radius:18px;padding:14px;margin:14px auto}canvas{display:block;width:100%;max-width:620px;height:auto;aspect-ratio:620/380;background:#101a2e;border-radius:12px;margin:auto;touch-action:none}button{border:0;border-radius:12px;background:linear-gradient(110deg,#5eead4,#60a5fa);padding:12px 18px;font-weight:900;font-size:16px;color:#081526;margin:5px;touch-action:manipulation}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.score{font-weight:900;color:#fbbf24;font-size:20px}.hint{font-size:13px;color:#9fb0cb}</style></head><body><main><a href="../">← Vissza a MiniGames oldalra</a><h1>Ügyességi 🫧 · Buborékvár</h1><p>Pukkaszd ki a felbukkanó buborékokat, mielőtt eltűnnek!</p><div class="panel"><div class="score" id="score">Pont: 0</div><canvas id="c" width="620" height="380"></canvas><div class="controls" id="controls"><button id="left">◀</button><button id="action">Játék / Akció</button><button id="right">▶</button></div><p class="hint" id="hint">Érintsd a gombokat vagy használd a billentyűzetet!</p><button id="start">Indítás / Újrakezdés</button></div></main><script>
const type="bubbles",c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint');let score=0,live=false,t=0,px=300,py=310,vx=3,vy=-4,objs=[],keys={},cells=[],revealed=[],matches=0,player={x:300,y:320},last=0;
function scoreSet(n){score=n;scoreEl.textContent='Pont: '+score}
function text(s,y=190,size=28){x.fillStyle='#f4f7ff';x.font='bold '+size+'px system-ui';x.textAlign='center';x.fillText(s,310,y)}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}
function reset(){scoreSet(0);live=true;t=0;objs=[];px=300;py=310;vx=3;vy=-4;player={x:300,y:320};revealed=[];matches=0;cells=[];if(type==='maze'){const rows=9,cols=13;for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)cells.push((r===0||q===0||r===rows-1||q===cols-1||((r*7+q*3)%5===0&&!(r===1&&q===1)&&!(r===7&&q===11)))?1:0);cells[1*cols+1]=0;cells[7*cols+11]=0;player={x:1,y:1}}if(type==='pairs'){cells=[1,2,3,4,5,6,1,2,3,4,5,6].sort(()=>Math.random()-.5)}draw()}
function end(s){live=false;text(s,190,30);text('Pontszám: '+score,235,22)}
function draw(){rect(0,0,620,380,'#101a2e');
if(type==='race'){rect(160,0,300,380,'#28364b');for(let y=-20;y<400;y+=70)rect(307,y+(t%70),6,35,'#e9e8cf');rect(px-22,300,44,65,'#38bdf8');objs.forEach(o=>{rect(o.x-20,o.y,40,58,'#fb923c')});}
if(type==='shooter'||type==='dodge'){circle(player.x,330,19,'#5eead4');text('▲',338,18);objs.forEach(o=>circle(o.x,o.y,o.r||14,o.col||'#fb7185'));if(type==='shooter')objs.filter(o=>o.bullet).forEach(o=>rect(o.x-3,o.y,6,15,'#fde047'))}
if(type==='jump'){rect(0,345,620,35,'#315b48');rect(px,295,38,50,'#60a5fa');objs.forEach(o=>{if(o.star)text('⭐',o.x,o.y+20,22);else rect(o.x,o.y,30,45,'#fb923c')})}
if(type==='pong'){rect(15,py,14,85,'#5eead4');rect(591,150,14,85,'#fb923c');circle(px,player.y,11,'#fbbf24');}
if(type==='maze'){for(let r=0;r<9;r++)for(let q=0;q<13;q++)rect(q*47,r*42,45,40,cells[r*13+q]?'#33445f':'#15243a');rect(11+player.x*47,7+player.y*42,31,28,'#5eead4');text('🏁',8*47+23,8*42+28,22)}
if(type==='target'){objs.forEach(o=>{circle(o.x,o.y,o.r,'#fb7185');circle(o.x,o.y,o.r*.55,'#fef08a');circle(o.x,o.y,o.r*.2,'#ef4444')})}
if(type==='bubbles'){objs.forEach(o=>{circle(o.x,o.y,o.r,'#38bdf8');circle(o.x-5,o.y-5,5,'#dff7ff')})}
if(type==='pairs'){cells.forEach((v,i)=>{let a=i%4,b=Math.floor(i/4),xx=80+a*120,yy=55+b*90;rect(xx,yy,95,70,revealed.includes(i)?'#1b756f':'#30415e');if(revealed.includes(i))text(v,yy+42,25);else text('?',yy+42,25)})}
if(type==='basket'){rect(445,105,12,120,'#e2e8f0');rect(400,210,90,8,'#fb923c');circle(px,py,17,'#f97316');}
if(!live)text('Indítsd el a játékot!',32,16)}
function frame(){if(!live)return;t++;if(type==='race'){if(keys.ArrowLeft||keys.a)px-=5;if(keys.ArrowRight||keys.d)px+=5;px=Math.max(180,Math.min(440,px));if(t%48===0)objs.push({x:190+Math.random()*240,y:-60});objs.forEach(o=>o.y+=5);objs=objs.filter(o=>o.y<400);if(objs.some(o=>Math.abs(o.x-px)<37&&o.y>260&&o.y<360))return end('Ütközés!');if(t%10===0)scoreSet(score+1)}
if(type==='shooter'||type==='dodge'){if(keys.ArrowLeft||keys.a)player.x-=5;if(keys.ArrowRight||keys.d)player.x+=5;player.x=Math.max(20,Math.min(600,player.x));if(t%36===0)objs.push({x:20+Math.random()*580,y:-10,r:13});objs.forEach(o=>o.y+=3);if(type==='shooter'){objs.filter(o=>o.bullet).forEach(o=>o.y-=8);if(t%20===0)objs.push({x:player.x,y:315,bullet:true});objs=objs.filter(o=>o.y<390);for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(!o.bullet&&objs.some(b=>b.bullet&&Math.abs(b.x-o.x)<17&&Math.abs(b.y-o.y)<20)){objs.splice(i,1);scoreSet(score+1)}}}else if(objs.some(o=>!o.bullet&&Math.abs(o.x-player.x)<25&&o.y>300&&o.y<350))return end('Meteor találat!');if(t%12===0)scoreSet(score+1)}
if(type==='jump'){if((keys.ArrowUp||keys[' '])&&py>=310)vy=-12;py+=vy;vy+=.55;if(py>310){py=310;vy=0}if(t%48===0)objs.push({x:640,y:300,star:Math.random()<.35});objs.forEach(o=>o.x-=5);objs=objs.filter(o=>o.x>-30);if(objs.some(o=>!o.star&&Math.abs(o.x-px)<32&&py>260))return end('Akadály!');objs=objs.filter(o=>{if(o.star&&Math.abs(o.x-px)<35&&Math.abs(o.y-py)<50){scoreSet(score+5);return false}return true});if(t%12===0)scoreSet(score+1)}
if(type==='pong'){if(keys.ArrowUp)py-=6;if(keys.ArrowDown)py+=6;py=Math.max(0,Math.min(295,py));px+=vx;player.y+=vy;if(player.y<10||player.y>370)vy*=-1;if(px>575){vx=-Math.abs(vx);scoreSet(score+1)}if(px<40){if(player.y>py-10&&player.y<py+95)vx=Math.abs(vx);else return end('Pont!')}}
if(type==='target'){if(t%50===0)objs=[{x:40+Math.random()*540,y:60+Math.random()*260,r:27}];}
if(type==='bubbles'){if(t%34===0)objs.push({x:30+Math.random()*560,y:390,r:18+Math.random()*13});objs.forEach(o=>o.y-=2);objs=objs.filter(o=>o.y>-20);if(t%30===0)scoreSet(score+1)}
if(type==='basket'){if(t%70===0){objs.push({x:410,y:200,r:12});}objs.forEach(o=>{o.x+=3;o.y-=5});if(objs.some(o=>o.x>445&&o.x<490&&o.y<230)){scoreSet(score+2);objs=[]}}
if(type==='maze'){if(keys.ArrowLeft)move(-1,0);if(keys.ArrowRight)move(1,0);if(keys.ArrowUp)move(0,-1);if(keys.ArrowDown)move(0,1);keys={};}
draw();requestAnimationFrame(frame)}
function move(dx,dy){let nx=player.x+dx,ny=player.y+dy;if(nx>=0&&nx<13&&ny>=0&&ny<9&&!cells[ny*13+nx]){player.x=nx;player.y=ny;scoreSet(score+1);if(nx===11&&ny===7)end('Sikerült kijutni!')}}
function action(){if(!live){reset();requestAnimationFrame(frame);return}if(type==='target'){if(objs.length){scoreSet(score+5);objs=[]}}else if(type==='shooter'){objs.push({x:player.x,y:315,bullet:true})}else if(type==='jump'&&py>=310){vy=-12}else if(type==='basket'){px=390;py=240;objs.push({x:410,y:200,r:12})}else if(type==='pong'){vy=-vy}}
function pointer(e){let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*620/r.width,my=(e.clientY-r.top)*380/r.height;if(type==='pairs'){let a=Math.floor((mx-80)/120),b=Math.floor((my-55)/90),i=b*4+a;if(a>=0&&a<4&&b>=0&&b<3&&!revealed.includes(i)){revealed.push(i);if(revealed.length===2){if(cells[revealed[0]]===cells[revealed[1]]){matches++;scoreSet(score+10);revealed=[];if(matches===6)end('Minden pár megvan!')}else setTimeout(()=>{revealed=[];draw()},650)}}}else if(type==='target'||type==='bubbles'){let i=objs.findIndex(o=>Math.hypot(o.x-mx,o.y-my)<o.r+10);if(i>=0){objs.splice(i,1);scoreSet(score+5)}}else if(type==='race'||type==='dodge'||type==='shooter')player.x=mx;else if(type==='basket'){px=mx;py=my;action()}else if(type==='maze'){let dx=Math.round((mx-310)/47),dy=Math.round((my-190)/42);move(Math.sign(dx),Math.sign(dy))}draw()}
c.addEventListener('pointerdown',pointer);document.getElementById('start').onclick=()=>{reset();requestAnimationFrame(frame)};document.getElementById('action').onclick=action;document.getElementById('left').onpointerdown=()=>{keys.ArrowLeft=true};document.getElementById('left').onpointerup=()=>{keys.ArrowLeft=false};document.getElementById('right').onpointerdown=()=>{keys.ArrowRight=true};document.getElementById('right').onpointerup=()=>{keys.ArrowRight=false};document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();action()}});document.addEventListener('keyup',e=>keys[e.key]=false);
if(type==='maze')hint.textContent='Használd a nyilakat, vagy koppints a labirintus irányába.';if(type==='pairs')hint.textContent='Koppints két kártyára, és találd meg a számpárokat.';if(type==='target'||type==='bubbles')hint.textContent='Koppints a célokra vagy buborékokra!';if(type==='basket')hint.textContent='Koppints a vászonra a dobáshoz.';draw();
</script></body></html>
