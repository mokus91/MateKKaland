<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tank aréna – MiniGames</title><style>body{margin:0;background:#101827;color:#f3f7ff;font:17px system-ui;text-align:center;padding:14px}.wrap{max-width:620px;margin:auto}h1{color:#78ead8}canvas{display:block;width:min(96vw,560px);height:auto;margin:12px auto;border:3px solid #3b5875;border-radius:14px;background:#182b25;touch-action:none}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{min-width:48px;min-height:44px;border:0;border-radius:10px;background:#70e2cf;color:#10202d;font-weight:800;padding:10px 15px}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;margin:10px}.pad button{font-size:20px}p{color:#c6d5e9}a{color:#78ead8}</style><div class="wrap"><h1>🛡️ Tank aréna</h1><p>Irányítsd a tankot, kerüld az akadályokat, és találd el a célpontokat! 5 hullám vár rád.</p><p id="stats">Élet: 3 · Találat: 0 · Hullám: 1</p><canvas id="arena" width="560" height="420" aria-label="Tank aréna játéktér"></canvas><div class="row"><button id="start">Játék indítása</button><button id="fire">💥 Lövés</button></div><div class="pad"><span></span><button data-move="up">⬆</button><span></span><button data-move="left">⬅</button><button data-move="down">⬇</button><button data-move="right">➡</button></div><p id="msg" aria-live="polite">Billentyűzet: nyilak vagy WASD, lövés: szóköz.</p><p><a href="../">← MiniGames főoldal</a></p></div><script>const c=document.getElementById("arena"),x=c.getContext("2d");let player,targets,bullets,keys={},hits=0,lives=3,wave=1,running=false,raf=0,last=0;const walls=[{x:130,y:75,w:65,h:90},{x:360,y:245,w:70,h:95},{x:245,y:160,w:55,h:55}];function reset(){player={x:280,y:355,a:-Math.PI/2};targets=[];bullets=[];hits=0;lives=3;wave=1;spawn();running=true;last=0;document.getElementById("msg").textContent="Védd meg magad, és teljesítsd mind az 5 hullámot!";cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function spawn(){targets=[];for(let i=0;i<Math.min(2+wave,6);i++)targets.push({x:35+Math.random()*490,y:35+Math.random()*210,hp:1,cd:50+Math.random()*90})}function blocked(px,py){return walls.some(w=>px>w.x-13&&px<w.x+w.w+13&&py>w.y-13&&py<w.y+w.h+13)}function drawTank(o,color){x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle=color;x.fillRect(-13,-11,26,22);x.fillStyle="#15221c";x.fillRect(-7,-16,14,32);x.fillStyle=color;x.fillRect(0,-4,22,8);x.restore()}function render(){x.fillStyle="#193326";x.fillRect(0,0,560,420);x.strokeStyle="#284b38";for(let i=0;i<560;i+=28){x.beginPath();x.moveTo(i,0);x.lineTo(i,420);x.stroke()}walls.forEach(w=>{x.fillStyle="#687b69";x.fillRect(w.x,w.y,w.w,w.h);x.strokeStyle="#9aab93";x.strokeRect(w.x,w.y,w.w,w.h)});bullets.forEach(b=>{x.fillStyle="#ffe17a";x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});targets.forEach(t=>drawTank(t,"#e66b58"));if(player)drawTank(player,"#5eead4")}function fire(){if(!running)return;bullets.push({x:player.x+Math.cos(player.a)*22,y:player.y+Math.sin(player.a)*22,vx:Math.cos(player.a)*7,vy:Math.sin(player.a)*7})}function loop(ts){if(!running)return;let dt=Math.min(2,(ts-last)/16.67||1);last=ts;let dx=0,dy=0;if(keys.up||keys.w)dy=-1;if(keys.down||keys.s)dy=1;if(keys.left||keys.a)dx=-1;if(keys.right||keys.d)dx=1;if(dx||dy){player.a=Math.atan2(dy,dx);let nx=player.x+dx*2.4*dt,ny=player.y+dy*2.4*dt;if(nx>15&&nx<545&&ny>15&&ny<405&&!blocked(nx,ny)){player.x=nx;player.y=ny}}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.x>0&&b.x<560&&b.y>0&&b.y<420&&!walls.some(w=>b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h));targets.forEach(t=>{t.cd-=dt;if(t.cd<=0){let a=Math.atan2(player.y-t.y,player.x-t.x);bullets.push({x:t.x+Math.cos(a)*18,y:t.y+Math.sin(a)*18,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,enemy:true});t.cd=80+Math.random()*50}});bullets=bullets.filter(b=>{if(b.enemy&&Math.hypot(b.x-player.x,b.y-player.y)<17){lives--;return false}if(!b.enemy){let i=targets.findIndex(t=>Math.hypot(b.x-t.x,b.y-t.y)<18);if(i>=0){targets.splice(i,1);hits++;return false}}return true});if(lives<=0){end(false);return}if(!targets.length){if(wave===5){end(true);return}wave++;spawn()}document.getElementById("stats").textContent="Élet: "+lives+" · Találat: "+hits+" · Hullám: "+wave+"/5";render();raf=requestAnimationFrame(loop)}function end(win){running=false;cancelAnimationFrame(raf);document.getElementById("msg").textContent=win?"Győzelem! Mind az 5 hullámot teljesítetted! 🏆":"A tankod megsérült. Elért hullám: "+wave+". Próbáld újra!"}document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();keys[k]=true;if(k===" ")fire()});document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll("[data-move]").forEach(b=>{let k={up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"}[b.dataset.move];b.onpointerdown=e=>{e.preventDefault();keys[k.toLowerCase()]=true};["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k.toLowerCase()]=false))});document.getElementById("fire").onclick=fire;document.getElementById("start").onclick=reset;render();</script></html>
