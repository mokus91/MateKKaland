<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memória kártyák – MiniGames</title><style>body{margin:0;background:#101a30;color:#fff;font:18px system-ui;text-align:center;padding:20px}.box{max-width:520px;margin:auto}h1{color:#75ead7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px auto}.card{height:90px;border:0;border-radius:15px;background:#294467;color:white;font-size:36px;cursor:pointer}.card.open,.card.done{background:#d6f8ef;color:#102b35}.card:disabled{opacity:1}button.again{padding:12px 22px;border:0;border-radius:12px;background:#67e8d4;font-weight:bold;font-size:16px}p{color:#c5d4eb}@media(max-width:420px){.card{height:72px;font-size:28px;gap:7px}}</style><div class="box"><h1>🧠 Memória kártyák</h1><p>Találd meg a 6 párt! Kattints két kártyára.</p><p id="score">Lépések: 0</p><div class="grid" id="grid"></div><p id="msg" aria-live="polite"></p><button class="again" onclick="start()">Újrakezdés</button><p><a href="../" style="color:#75ead7">← Vissza a MiniGames oldalra</a></p></div><script>const icons=["🐱","🐶","🐸","🦊","🐼","🐵"];let first=null,lock=false,moves=0,found=0;function start(){let a=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;found=0;document.getElementById("score").textContent="Lépések: 0";document.getElementById("msg").textContent="";document.getElementById("grid").innerHTML=a.map((v,i)=>'<button class="card" data-v="'+v+'" aria-label="Rejtett kártya">❔</button>').join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>flip(b))}function flip(b){if(lock||b.disabled||b===first)return;b.textContent=b.dataset.v;b.classList.add("open");if(!first){first=b;return}moves++;document.getElementById("score").textContent="Lépések: "+moves;if(first.dataset.v===b.dataset.v){[first,b].forEach(x=>{x.classList.add("done");x.disabled=true});first=null;found++;if(found===icons.length)document.getElementById("msg").textContent="Ügyes vagy! Minden párt megtaláltál! 🎉"}else{lock=true;let old=first;setTimeout(()=>{old.textContent="❔";b.textContent="❔";old.classList.remove("open");b.classList.remove("open");first=null;lock=false},800)}}start();</script></html>
