<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memória kártyák – MiniGames</title><style>body{margin:0;background:#101a30;color:#fff;font:18px system-ui;text-align:center;padding:16px}.box{max-width:650px;margin:auto}h1{color:#75ead7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px auto}.card{min-height:66px;border:0;border-radius:13px;background:#294467;color:white;font-size:30px;cursor:pointer}.card.open,.card.done{background:#d6f8ef;color:#102b35}.card:disabled{opacity:1}.bar button,button.again{padding:10px 15px;border:0;border-radius:10px;background:#67e8d4;font-weight:bold;margin:4px;font-size:16px}.bar button.selected{background:#fff}.stats{color:#d0def0}@media(min-width:520px){.card{height:86px;font-size:36px}}a{color:#75ead7}</style><div class="box"><h1>🧠 Memória kártyák</h1><p>Találd meg az összes állatpárt! Válassz nehézséget.</p><div class="bar"><button onclick="start(6)">Könnyű · 6 pár</button><button onclick="start(10)">Közepes · 10 pár</button><button onclick="start(16)">Nehéz · 16 pár</button></div><p class="stats" id="score">Lépések: 0 · Megtalált párok: 0</p><div class="grid" id="grid"></div><p id="msg" aria-live="polite"></p><button class="again" onclick="start(pairs)">Újrakezdés</button><p><a href="../">← Vissza a MiniGames oldalra</a></p></div><script>const icons=["🐱","🐶","🐸","🦊","🐼","🐵","🦁","🐯","🐰","🐻","🐨","🐮","🐷","🐧","🦄","🐢"];let first=null,lock=false,moves=0,found=0,pairs=6;function start(count=6){pairs=count;let a=[...icons.slice(0,count),...icons.slice(0,count)].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;found=0;document.getElementById("score").textContent="Lépések: 0 · Megtalált párok: 0 / "+pairs;document.getElementById("msg").textContent="";let grid=document.getElementById("grid");grid.style.gridTemplateColumns=count>10?"repeat(4,1fr)":"repeat(4,1fr)";grid.innerHTML=a.map(v=>'<button class="card" data-v="'+v+'" aria-label="Rejtett kártya">❔</button>').join("");grid.querySelectorAll("button").forEach(b=>b.onclick=()=>flip(b))}function flip(b){if(lock||b.disabled||b===first)return;b.textContent=b.dataset.v;b.classList.add("open");if(!first){first=b;return}moves++;document.getElementById("score").textContent="Lépések: "+moves+" · Megtalált párok: "+found+" / "+pairs;if(first.dataset.v===b.dataset.v){[first,b].forEach(x=>{x.classList.add("done");x.disabled=true});first=null;found++;document.getElementById("score").textContent="Lépések: "+moves+" · Megtalált párok: "+found+" / "+pairs;if(found===pairs)document.getElementById("msg").textContent="Gratulálok! Minden párt megtaláltál! 🎉"}else{lock=true;let old=first;setTimeout(()=>{old.textContent="❔";b.textContent="❔";old.classList.remove("open");b.classList.remove("open");first=null;lock=false},850)}}start();</script></html>
