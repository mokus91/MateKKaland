<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidám matek – MiniGames</title><style>body{margin:0;background:#102039;color:white;font:20px system-ui;text-align:center;padding:24px}.box{max-width:460px;margin:7vh auto;background:#1b3151;border-radius:22px;padding:25px}h1{color:#7bead8}.question{font-size:54px;font-weight:900;margin:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button,.again{padding:15px;border:0;border-radius:13px;background:#73dff0;color:#102039;font-size:24px;font-weight:bold;cursor:pointer}.again{font-size:17px;margin-top:18px}p{color:#d0def0}</style><div class="box"><h1>➕ Vidám matek</h1><p>Válaszd ki a helyes eredményt!</p><p id="progress">1 / 10. feladat</p><div class="question" id="q"></div><div class="choices" id="choices"></div><p id="msg" aria-live="polite"></p><button class="again" onclick="start()">Új játék</button><p><a href="../" style="color:#7bead8">← Vissza a MiniGames oldalra</a></p></div><script>let n=0,points=0,answer=0,done=false;function start(){n=0;points=0;done=false;next()}function next(){if(n===10){document.getElementById("q").textContent="🎉";document.getElementById("choices").innerHTML="";document.getElementById("progress").textContent="Vége!";document.getElementById("msg").textContent="Eredmény: "+points+" / 10. Nagyon ügyes vagy!";return}n++;let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1,sub=Math.random()<.35;if(sub&&b>a)[a,b]=[b,a];answer=sub?a-b:a+b;document.getElementById("q").textContent=a+(sub?" − ":" + ")+b+" = ?";document.getElementById("progress").textContent=n+" / 10. feladat";document.getElementById("msg").textContent="Pontok: "+points;let opts=new Set([answer]);while(opts.size<4)opts.add(Math.max(0,answer+Math.floor(Math.random()*9)-4));let arr=[...opts].sort(()=>Math.random()-.5);document.getElementById("choices").innerHTML=arr.map(x=>'<button>'+x+'</button>').join("");document.querySelectorAll(".choices button").forEach(btn=>btn.onclick=()=>{if(done)return;done=true;if(+btn.textContent===answer){points++;document.getElementById("msg").textContent="Helyes! ⭐"}else document.getElementById("msg").textContent="Majdnem! A helyes válasz: "+answer;setTimeout(()=>{done=false;next()},900)})}start();</script></html>
