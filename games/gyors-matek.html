<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidám matek – MiniGames</title><style>body{margin:0;background:#102039;color:white;font:20px system-ui;text-align:center;padding:16px}.box{max-width:500px;margin:4vh auto;background:#1b3151;border-radius:22px;padding:22px}h1{color:#7bead8}.question{font-size:48px;font-weight:900;margin:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button,.again,.level{padding:13px;border:0;border-radius:12px;background:#73dff0;color:#102039;font-size:22px;font-weight:bold;cursor:pointer}.again,.level{font-size:16px;margin:5px}.level.selected{background:#fff}p{color:#d0def0}a{color:#7bead8}</style><div class="box"><h1>➕ Vidám matek</h1><p>Válassz szintet, és oldj meg 30 feladatot!</p><div><button class="level" onclick="start('easy')">Könnyű</button><button class="level" onclick="start('medium')">Közepes</button><button class="level" onclick="start('hard')">Haladó</button></div><p id="progress">1 / 30. feladat</p><div class="question" id="q"></div><div class="choices" id="choices"></div><p id="msg" aria-live="polite"></p><button class="again" onclick="start(level)">Új játék</button><p><a href="../">← Vissza a MiniGames oldalra</a></p></div><script>let n=0,points=0,answer=0,done=false,level="easy";function start(l="easy"){level=l;n=0;points=0;done=false;next()}function next(){if(n===30){document.getElementById("q").textContent="🏆";document.getElementById("choices").innerHTML="";document.getElementById("progress").textContent="Vége! 30 / 30";document.getElementById("msg").textContent="Eredményed: "+points+" / 30 pont. "+(points>=25?"Fantasztikus munka!":points>=15?"Nagyon ügyes vagy!":"Gyakorolj tovább, menni fog!");return}n++;let max=level==="easy"?10:level==="medium"?30:100;let ops=level==="easy"?["+","−"]:level==="medium"?["+","−","×"]:["+","−","×"];let op=ops[Math.floor(Math.random()*ops.length)],a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1;if(op==="−"&&b>a)[a,b]=[b,a];if(op==="×"){a=Math.floor(Math.random()*(level==="hard"?12:10))+1;b=Math.floor(Math.random()*10)+1}answer=op==="+"?a+b:op==="−"?a-b:a*b;document.getElementById("q").textContent=a+" "+op+" "+b+" = ?";document.getElementById("progress").textContent=n+" / 30. feladat · Pont: "+points;let opts=new Set([answer]);while(opts.size<4){let delta=Math.floor(Math.random()*Math.max(8,Math.min(25,max)))-Math.floor(max/8);opts.add(Math.max(0,answer+delta))}document.getElementById("choices").innerHTML=[...opts].sort(()=>Math.random()-.5).map(x=>'<button>'+x+'</button>').join("");document.querySelectorAll(".choices button").forEach(btn=>btn.onclick=()=>{if(done)return;done=true;if(+btn.textContent===answer){points++;document.getElementById("msg").textContent="Helyes válasz! ⭐"}else document.getElementById("msg").textContent="A helyes válasz: "+answer;setTimeout(()=>{done=false;next()},650)})}start();</script></html>
